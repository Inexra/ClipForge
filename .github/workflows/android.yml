name: Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Could not find sdkmanager in $ANDROID_SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"

      - name: Bundle offline speech models
        shell: bash
        run: |
          set -euo pipefail
          ASSET_DIR="app/src/main/assets/offline-caption-models"
          mkdir -p "$ASSET_DIR"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip" \
            --output "$ASSET_DIR/vosk-model-small-en-us-0.15.zip"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip" \
            --output "$ASSET_DIR/vosk-model-small-hi-0.22.zip"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
